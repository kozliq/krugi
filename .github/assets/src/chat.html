<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Telegram (тёмная тема) — шрифт системный, как в самом приложении */
:root{--w:440px;--h:600px}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#0e1621;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17212b}
header img{width:42px;height:42px;border-radius:50%}
header b{display:block;font-size:16px}
header span{font-size:13px;color:#8ea1b3}
main{flex:1;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.me{align-self:flex-end;background:#2b5278;padding:8px 12px 8px 8px;border-radius:14px 14px 4px 14px;font-size:15px;display:flex;gap:10px;align-items:center}
.me i{width:46px;height:64px;border-radius:6px;background:url(note-frame.jpg) center/cover;display:block}
.me small{display:block;font-size:13px;color:#a9c4e0;margin-top:2px}
.msg{align-self:flex-start;background:#182533;padding:9px 12px;border-radius:14px 14px 14px 4px;font-size:15px;line-height:1.4}
.bar{letter-spacing:1px;color:#cfc2b3}
.note{align-self:flex-start;position:relative;width:230px;height:230px}
.note img{width:230px;height:230px;border-radius:50%;display:block}
.note span{position:absolute;left:12px;bottom:6px;font-size:12px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:9px}
</style>
<header><img src="../../../brand/avatar-640.png" alt=""><div><b>Кружок — видео в кружочек</b><span>бот</span></div></header>
<main>
<div class="me"><i></i><div>Видео<small>0:38 · 4,2 МБ</small></div></div>
<div class="msg">Делаю кружок<br><span class="bar">●●●●●●●○○○</span> 70%</div>
<div class="note"><img src="note-frame.jpg" alt=""><span>0:38</span></div>
</main>
